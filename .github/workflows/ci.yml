name: KNB Phase 0 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"realMoney":false' /tmp/health.json

      - name: Verify seeded assets
        run: |
          curl --fail --silent http://localhost:3001/assets > /tmp/assets.json
          for asset in EUR USD GBP BTC USDC USDT; do
            grep -q "\"code\":\"$asset\"" /tmp/assets.json
          done

      - name: Verify account creation and balanced ledger transaction
        run: |
          account=$(curl --fail --silent -X POST http://localhost:3001/accounts \
            -H 'content-type: application/json' \
            -d '{"ownerId":"ci-user","asset":"EUR"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          world=$(curl --fail --silent -X POST http://localhost:3001/accounts \
            -H 'content-type: application/json' \
            -d '{"ownerId":"ci-world","asset":"EUR"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl --fail --silent -X POST http://localhost:3001/transactions \
            -H 'content-type: application/json' \
            -H 'Idempotency-Key: ci-balanced-001' \
            -d "{\"entries\":[{\"accountId\":\"$world\",\"asset\":\"EUR\",\"amount\":\"-10000\"},{\"accountId\":\"$account\",\"asset\":\"EUR\",\"amount\":\"10000\"}]}" \
            | grep -q 'POSTED'

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
