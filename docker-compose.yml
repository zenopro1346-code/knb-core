services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knb
      POSTGRES_PASSWORD: knb
      POSTGRES_DB: knb
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knb -d knb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    profiles: ["identity"]

  api:
    build: ./apps/api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://knb:knb@postgres:5432/knb
      REDIS_URL: redis://redis:6379
      REAL_MONEY_ENABLED: "false"
      BLOCKCHAIN_SETTLEMENT_ENABLED: "false"
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
